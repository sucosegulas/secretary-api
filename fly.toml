app = "secretary-api"
primary_region = "gru"

[env]
  DATA_DIR = "/data"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# Persiste a sessão do WhatsApp (Baileys) em disco, para que reinícios
# no Fly não exijam escanear o QR Code de novo. O volume "secretary_data"
# já existe e está anexado à máquina atual.
[[mounts]]
  source = "secretary_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
